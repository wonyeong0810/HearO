# 힙 8G + 메타스페이스 4G 는 데몬 하나가 12.5GB 를 예약하겠다는 뜻이라, 개발
# 중에 에뮬레이터(4GB)와 백엔드 컨테이너를 같이 띄우면 JVM 이 시작도 못 하고
# 죽는다 (`hs_err_pid*.log`: "Native memory allocation (mmap) failed").
#
# 이 프로젝트의 실제 사용량 기준으로 낮춘다. 메타스페이스는 클래스 메타데이터만
# 담아서 512MB 로도 충분하고, 힙 4G 면 R8 을 포함한 릴리스 빌드도 통과한다.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
